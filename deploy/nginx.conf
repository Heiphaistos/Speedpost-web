# /etc/nginx/sites-available/speedpost  →  ln -s ../sites-available/speedpost /etc/nginx/sites-enabled/
# Certificat : sudo certbot --nginx -d speedpost.mondomaine.fr
server {
    listen 80;
    server_name speedpost.mondomaine.fr;

    # Envois en flux (morceaux de 48 Mo), sans mise en tampon ; pas de journal : les liens contiennent la clé
    access_log off;
    client_max_body_size 64m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
